appId: com.wuliaomiemie.dafeiyu
productName: DaFeiYu
copyright: Copyright © 2026 wuliaomiemie

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 大飞鱼
  runAfterFinish: true
  deleteAppDataOnUninstall: false
